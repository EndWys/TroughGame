# Перед запуском фичи скопируйте каталог в .ai/features/<feature-kebab-case>/.
# Храните краткие факты; основания решений записывайте в decisions.md.

workflow_version: "1.7-tg.1"
feature: <feature-kebab-case>
# Final stages: final_verification -> workflow_audit -> final readiness acceptance
# -> notion_finalization -> retrospective (optional local knowledge promotion) -> complete.
# Notion worker receipts remain outside feature state.
stage: requirements
status: in_progress # in_progress | waiting_for_approval | blocked | failed | complete
current_subtask: null

repository:
  last_reconciled_at: null
  working_tree_status: unknown # clean | changed | unknown
  staged_paths: []
  unstaged_paths: []
  untracked_paths: []
  ignored_paths: [] # посторонние/сгенерированные пути по классификации разработчика; не добавлять в индекс
  diff_fingerprint: null # детерминированный отпечаток отслеживаемых изменений в индексе и вне него
  stash_refs: [] # ссылки stash, видимые при создании снимка
  reconciliation_status: unknown # verified | mismatch | needs_developer_decision | unknown

checkpoints: []
# Форма контрольной точки:
# - id: CP-001
#   subtask: FEAT-01
#   kind: implementation # implementation | fix
#   marker: <feature-kebab-case>/FEAT-01/CP-001
#   approval_id: APR-001
#   status: committed

requirements:
  source: null
  reference: requirements.md
  status: pending # pending | approved
  approval:
    by: null
    at: null
    reference: null

research:
  status: pending # pending | complete | changed
  reference: research.md
  recorded_at: null

acceptance_criteria: []

plan:
  revision: 0
  status: pending # pending | approved | changed
  approval:
    by: null
    at: null
    reference: null

subtasks: []
# Форма подзадачи:
# - id: FEAT-01
#   title: null
#   status: pending # pending | waiting_for_architecture_approval | in_progress | waiting_for_review | waiting_for_play_mode | accepted | blocked
#   dependencies: []
#   scope:
#     allowed: []
#     out_of_scope: []
#   validation: []
#   architecture:
#     status: pending # pending | approved | changed
#     reference: subtasks/FEAT-01.md
#     approval_id: null
#   audit:
#     status: pending # pending | passed | findings_required
#     finding_ids: []
#     recorded_at: null

approvals: []
# Форма согласования:
# - id: APR-001
#   gate: requirements # requirements | plan | architecture | scope_expansion | review | play_mode | plan_change | final_readiness | bug_diagnostic_plan | bug_fix_plan
#   subject: null
#   decision: approved # approved | rejected | changes_requested
#   by: null
#   at: null
#   reference: null

pending_questions: []
# Форма вопроса:
# - id: Q-001
#   question: null
#   blocking_stage: null
#   status: open # open | answered | superseded
#   answer_reference: null

decisions: []
# Форма решения:
# - id: DEC-001
#   title: null
#   status: proposed # proposed | approved | rejected | superseded
#   reference: decisions.md#dec-001

interruptions: []
# Необязательная форма цикла исправления:
# - id: INT-001
#   kind: architecture_feedback # architecture_feedback | review_correction | post_play_mode_bug | developer_requested_change | defect_investigation
#   origin_stage: subtask_architecture
#   subtask: FEAT-01
#   status: active # active | complete | return_pending | resumed
#   trigger_reference: null
#   completion_evidence: []
#   return_decision_reference: null

validation_evidence: []
# Форма подтверждения:
# - id: VAL-001
#   scope: null
#   kind: compile # compile | test | editor | play_mode | build | manual
#   command: null
#   status: not_run # passed | failed | not_run | not_available
#   result_path: null
#   evidence_retention: retained # retained | cleaned
#   recorded_at: null

final_verification:
  status: pending # pending | complete | attention_required
  report_path: final-verification.md
  reported_to_developer_at: null
  recorded_at: null

workflow_audit:
  status: not_run # not_run | complete | attention_required
  result_path: null
  report_path: null
  evidence_retention: retained # retained | cleaned
  recorded_at: null
  reported_to_developer_at: null

knowledge_promotion:
  status: pending # pending | not_applicable | waiting_for_decision | applying | complete
  reference: knowledge-promotion.md
  candidates: []
# Форма кандидата:
# - id: KNP-001
#   status: proposed # proposed | approved | rejected | change_requested | applied
#   target: null
#   reference: knowledge-promotion.md#knp-001
#   approval_id: null
#   evidence: []
#   validation_evidence: []
#   commit: null

evidence_cleanup:
  status: pending # pending | complete | partial
  completed_at: null
  removed_directories: []

next_action:
  owner: agent # agent | developer
  description: Проанализировать требования и подготовить их согласование.

last_updated_at: null
